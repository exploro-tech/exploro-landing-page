<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
<title>Exploro — Coming soon (lamp)</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ex,.ex *{box-sizing:border-box}
.ex{font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .8s ease,color .8s ease}
.qs{font-family:'Quicksand','Instrument Sans',ui-sans-serif,system-ui,sans-serif}
.ex button{font:inherit;cursor:pointer}
.ex :focus-visible{outline:2px solid #37E2BB;outline-offset:3px}
.fade{transition:opacity .9s ease}
.tc{transition:color .8s ease,background-color .8s ease,border-color .8s ease}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.r1{animation:rise .9s ease both}.r2{animation:rise .9s .12s ease both}.r3{animation:rise .9s .24s ease both}.r4{animation:rise .9s .36s ease both}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.float{animation:float 8s ease-in-out infinite}
/* lamp switching on: a short flicker, then a steady warm glow */
@keyframes flick{0%{opacity:0}8%{opacity:.85}12%{opacity:.15}20%{opacity:1}26%{opacity:.45}34%{opacity:1}100%{opacity:1}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.86}}
.glow{opacity:0;transition:opacity .35s ease}
.glow.on{animation:flick 1.1s .45s ease both,breathe 5s 1.8s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,226,187,.55)}70%{box-shadow:0 0 0 10px rgba(55,226,187,0)}100%{box-shadow:0 0 0 0 rgba(55,226,187,0)}}
.pulse{animation:pulse 2.4s infinite}
.knob{transition:transform .45s cubic-bezier(.5,1.6,.4,1),background-color .6s ease}
.lk{text-decoration:none;display:inline-flex;align-items:center;gap:7px;min-height:32px}
.lk:hover{text-decoration:underline;text-underline-offset:3px}
@media (max-width:860px){.ex{height:auto!important;min-height:100svh!important}.grid{grid-template-columns:1fr!important;grid-template-rows:auto auto!important;gap:12px 0!important;padding-top:clamp(12px,4vh,40px)!important;text-align:center}.lead{align-items:center!important;padding-bottom:0!important}.foot{justify-content:center!important;text-align:center;padding-top:24px!important}}
@media (max-width:420px){.ex header{gap:8px!important}.ex header .qs{font-size:23px!important}.foot{flex-direction:column}}
@media (prefers-reduced-motion:reduce){.r1,.r2,.r3,.r4,.float,.pulse{animation:none}.glow.on{animation:none;opacity:1}.fade,.ex,.tc,.knob{transition:none}}
</style>
</helmet>
<main class="ex" aria-labelledby="t" style="position: relative; height: 100vh; min-height: 560px; overflow: hidden; background-color: {{bg}}; color: {{fg}}; display: flex; flex-direction: column">
  <!-- page-level warm spill from the lamp (dark only) -->
  <span class="glow {{lampCls}}" aria-hidden="true" style="position: absolute; left: 34%; top: -12%; width: 60%; height: 110%; background: radial-gradient(closest-side, rgba(255,184,96,.16), rgba(255,184,96,0)); pointer-events: none"></span>
  <span class="fade" aria-hidden="true" style="position: absolute; right: -10%; top: 10%; width: 70%; height: 90%; background: radial-gradient(closest-side, rgba(55,226,187,.08), rgba(55,226,187,0)); opacity: {{darkOp}}; pointer-events: none"></span>

  <header class="r1" style="position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; padding: clamp(20px, 3.4vh, 36px) clamp(20px, 4.5vw, 72px)">
    <span style="position: relative; height: 30px; width: 40px; flex: none">
      <img class="fade" src="./assets/2e25d1af8f3f493431c4b0bbaf1a7459.svg" alt="" style="position: absolute; left: 0; top: 0; height: 30px; width: auto; opacity: {{darkOp}}">
      <img class="fade" src="./assets/adf043e9fdb218e605bec3f4d3197049.svg" alt="" style="position: absolute; left: 0; top: 0; height: 30px; width: auto; opacity: {{lightOp}}">
    </span>
    <span class="qs tc" style="font-size: 27px; font-weight: 700; letter-spacing: -0.02em; color: {{strong}}">exploro</span>
    <span style="flex: 1"></span>
    <button onClick="{{toggle}}" role="switch" aria-checked="{{darkStr}}" aria-label="Dark mode" title="{{switchTitle}}" class="tc" style="position: relative; width: 74px; height: 38px; border-radius: 999px; border: 1px solid {{line}}; background-color: {{track}}; padding: 0">
      <span aria-hidden="true" style="position: absolute; left: 11px; top: 10px; display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{sunIcon}}" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>
      <span aria-hidden="true" style="position: absolute; right: 11px; top: 10px; display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{moonIcon}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></span>
      <span class="knob" aria-hidden="true" style="position: absolute; top: 3px; left: 3px; width: 30px; height: 30px; border-radius: 999px; background-color: {{knob}}; box-shadow: 0 2px 8px rgba(0,0,0,.25); transform: translateX({{knobX}}); display: flex; align-items: center; justify-content: center">
        <sc-if value="{{isDark}}" hint-placeholder-val="{{ true }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="#121317" stroke="#121317" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
        <sc-if value="{{isLight}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="#FFFFFF"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      </span>
    </button>
  </header>

  <div class="grid" style="position: relative; z-index: 1; flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.25fr); align-items: center; gap: 0 2vw; padding: 0 clamp(20px, 4.5vw, 72px)">
    <div class="lead" style="display: flex; flex-direction: column; align-items: flex-start; gap: clamp(16px, 2.6vh, 28px); padding-bottom: 4vh">
      <span class="r2 tc" style="display: inline-flex; align-items: center; gap: 10px; height: 34px; padding: 0 16px 0 12px; border-radius: 999px; border: 1px solid {{pillBd}}; background-color: {{pillBg}}; font-size: 12.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: {{accent}}"><span class="pulse" style="width: 8px; height: 8px; border-radius: 9px; background: #37E2BB"></span>Coming soon</span>
      <h1 id="t" class="qs r3 tc" style="margin: 0; font-size: clamp(48px, min(6.4vw, 10.5vh), 104px); line-height: .98; font-weight: 700; letter-spacing: -0.035em; color: {{strong}}">Closer to what you <span class="tc" style="color: {{accentBig}}">need.</span></h1>
      <p class="r4 tc" style="margin: 0; max-width: 440px; font-size: clamp(16px, 2.1vh, 19px); line-height: 1.55; color: {{muted}}">Pre-owned furniture, electronics and home essentials — from people near you. Opening first in Bengaluru.</p>
      <p class="r4 tc" aria-live="polite" style="margin: 0; font-size: 13px; color: {{hint}}">{{hintText}}</p>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; min-height: 0; height: 100%">
      <div class="float" style="position: relative; width: min(100%, calc(76vh * 4 / 3)); aspect-ratio: 4 / 3; -webkit-mask-image: radial-gradient(75% 72% at 50% 52%, #000 62%, transparent 100%); mask-image: radial-gradient(75% 72% at 50% 52%, #000 62%, transparent 100%)">
        <img class="fade" src="./assets/ad054ea82961177180873a9363eef212.webp" alt="" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: {{lightOp}}">
        <img class="fade" src="./assets/d7ad1dfb94b9ebcc600e167bffc465ca.webp" alt="" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: {{darkOp}}">
        <!-- lamp light: cone, floor pool, bulb bloom -->
        <span class="glow {{lampCls}}" aria-hidden="true" style="position: absolute; left: 22%; top: 19.5%; width: 31%; height: 46%; background: linear-gradient(180deg, rgba(255,206,130,.42) 0%, rgba(255,196,120,.16) 55%, rgba(255,190,110,0) 100%); clip-path: polygon(39% 0, 61% 0, 100% 100%, 0 100%); filter: blur(14px); mix-blend-mode: screen; pointer-events: none"></span>
        <span class="glow {{lampCls}}" aria-hidden="true" style="position: absolute; left: 22%; top: 55%; width: 31%; height: 18%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,190,110,.38), rgba(255,190,110,0)); mix-blend-mode: screen; pointer-events: none"></span>
        <span class="glow {{lampCls}}" aria-hidden="true" style="position: absolute; left: 36.9%; top: 19.8%; width: 26%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(255,246,222,.95) 0%, rgba(255,214,140,.55) 18%, rgba(255,184,96,.18) 45%, rgba(255,184,96,0) 100%); mix-blend-mode: screen; pointer-events: none"></span>
        <!-- tap the lamp to switch it -->
        <button onClick="{{toggle}}" aria-label="{{lampLabel}}" title="{{lampLabel}}" style="position: absolute; left: 36.9%; top: 16%; width: 9%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 0; background: transparent"></button>
      </div>
    </div>
  </div>

  <footer class="tc foot" style="position: relative; z-index: 2; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 20px; padding: 0 clamp(20px, 4.5vw, 72px) clamp(16px, 3vh, 28px); font-size: 13.5px; color: {{hint}}">
    <span>© 2026 Exploro · exploro.in</span>
    <span style="display: flex; gap: 22px">
      <a class="lk tc" href="https://www.instagram.com/exploro_india" target="_blank" rel="noopener noreferrer" style="color: {{linkC}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle></svg>Instagram</a>
      <a class="lk tc" href="https://www.linkedin.com/company/exploro-india/about" target="_blank" rel="noopener noreferrer" style="color: {{linkC}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"></path></svg>LinkedIn</a>
    </span>
  </footer>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startTheme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { dark: (p.startTheme || 'dark') !== 'light' }; }
  renderVals() {
    var self = this, d = this.state.dark;
    return {
      isDark: d, isLight: !d, darkStr: d ? 'true' : 'false',
      toggle: function () { self.setState({ dark: !self.state.dark }); },
      bg: d ? '#0D0E11' : '#F3F0EA', fg: d ? '#F4F4F0' : '#18181B', strong: d ? '#FFFFFF' : '#141416',
      muted: d ? '#A9A9A2' : '#4A4A50', hint: d ? '#6F6F6B' : '#6B6B70', line: d ? '#2A2B31' : '#D9D4CA',
      accent: d ? '#37E2BB' : '#0A6E5A', accentBig: d ? '#37E2BB' : '#0A6E5A',
      pillBd: d ? '#263B35' : '#BFE3D6', pillBg: d ? 'rgba(31,42,39,.6)' : 'rgba(227,245,239,.8)',
      linkC: d ? '#C9C9C2' : '#3A3A40',
      track: d ? '#1A1B20' : '#FFFFFF', knob: d ? '#F2D16B' : '#18181B', knobX: d ? '36px' : '0px',
      sunIcon: d ? '#6F6F6B' : '#18181B', moonIcon: d ? '#F2D16B' : '#9A968E',
      switchTitle: d ? 'Switch to light mode' : 'Switch to dark mode',
      lampCls: d ? 'on' : '', darkOp: d ? '1' : '0', lightOp: d ? '0' : '1',
      lampLabel: d ? 'Switch the lamp off (light mode)' : 'Switch the lamp on (dark mode)',
      hintText: d ? 'Tip: tap the lamp to switch it off.' : 'Tip: tap the lamp to switch it on.'
    };
  }
}
</script>
</body>
</html>
